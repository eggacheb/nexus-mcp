[package]
name = "nexus-tray"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0"
description = "nexus-mcp 托盘宿主：Windows 系统托盘常驻入口，托管协议层与隧道生命周期"

[[bin]]
name = "nexus-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
warnings = "deny"
