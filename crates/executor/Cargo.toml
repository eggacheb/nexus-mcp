[package]
name = "nexus-executor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "nexus-mcp 执行器：唯一的命令执行层，stdio 单行 JSON 协议"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
sha2 = "0.10"
base64 = "0.22"

[lints.rust]
warnings = "deny"
